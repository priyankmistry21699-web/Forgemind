# ============================================================
# ForgeMind — Docker Compose (Production)
# ============================================================
#
# Usage:
#   cp .env.example .env          # then edit with real values
#   docker compose -f docker-compose.prod.yml up -d --build
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
#
# Requirements:
#   - SECRET_KEY must be set to a random value (not the default)
#   - POSTGRES_PASSWORD must be changed from default
#   - At least one LLM API key should be set for planner features
#
# ============================================================

services:
  # ── Infrastructure ─────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: forgemind-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forgemind}
      POSTGRES_USER: ${POSTGRES_USER:-forgemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-forgemind}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No exposed ports — only accessible from internal network
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: forgemind-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Application ────────────────────────────────────────────

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: forgemind-api
    restart: always
    expose:
      - "8000"
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      API_WORKERS: ${API_WORKERS:-2}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS must be set}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-forgemind}
      POSTGRES_USER: ${POSTGRES_USER:-forgemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forgemind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forgemind}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set}
    container_name: forgemind-web
    restart: always
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?NEXT_PUBLIC_API_URL must be set}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - internal

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: forgemind-worker
    restart: always
    command: ["python", "-m", "worker.main"]
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-forgemind}
      POSTGRES_USER: ${POSTGRES_USER:-forgemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-forgemind}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-forgemind}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_URL: redis://redis:6379/0
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-5}
      WORKER_MAX_TASKS_PER_CYCLE: ${WORKER_MAX_TASKS_PER_CYCLE:-3}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ── Reverse Proxy ──────────────────────────────────────────

  nginx:
    image: nginx:1.27-alpine
    container_name: forgemind-nginx
    restart: always
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
