[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemind-core"
version = "0.1.0"
description = "Core domain constants, enums, and LLM client for the ForgeMind platform"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["litellm>=1.30.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
