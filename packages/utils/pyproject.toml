[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgemind-utils"
version = "0.1.0"
description = "Shared Python utilities for the ForgeMind platform"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.36.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]
