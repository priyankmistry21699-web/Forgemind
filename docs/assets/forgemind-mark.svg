<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="ForgeMind mark">
  <title>ForgeMind</title>
  <desc>A hexagonal governance frame enclosing a forge flame M-glyph with a central mind node and three graph sparks — ForgeMind.</desc>
  <defs>
    <linearGradient id="fm-flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="55%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Architecture / governance hex frame (readable on light + dark) -->
  <polygon
    points="40,6 69.5,23 69.5,57 40,74 10.5,57 10.5,23"
    fill="none"
    stroke="#64748B"
    stroke-width="2.5"
    stroke-linejoin="round"/>

  <!-- Graph sparks (mind / nodes), arranged across the top of the hex -->
  <circle cx="24" cy="18" r="1.8" fill="#F97316"/>
  <circle cx="40" cy="12" r="1.8" fill="#F97316"/>
  <circle cx="56" cy="18" r="1.8" fill="#F97316"/>
  <path d="M24 18 L40 12 L56 18" fill="none" stroke="#F97316" stroke-width="1" stroke-linecap="round" opacity="0.55"/>

  <!-- Forge flame M-glyph: two peaks with a central valley (reads as M) -->
  <path
    d="M 22 60
       C 22 46, 26 34, 32 24
       C 34 30, 36 38, 40 42
       C 44 38, 46 30, 48 24
       C 54 34, 58 46, 58 60
       Z"
    fill="url(#fm-flame)"/>

  <!-- Inner highlight to give the flame depth -->
  <path
    d="M 30 54
       C 30 46, 32 38, 36 30
       C 37 34, 38 38, 40 40
       C 42 38, 43 34, 44 30
       C 48 38, 50 46, 50 54
       Z"
    fill="#FDBA74"
    opacity="0.35"/>

  <!-- Mind node at the valley where the peaks meet -->
  <circle cx="40" cy="42" r="3.6" fill="#FFFFFF" stroke="#EA580C" stroke-width="2.2"/>
</svg>
