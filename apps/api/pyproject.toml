[project]
name = "forgemind-api"
version = "0.1.0"
description = "ForgeMind API — FastAPI backend for the autonomous engineering platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "litellm>=1.50.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
    # Shared monorepo packages (FM-079)
    "forgemind-utils",
    "forgemind-core",
    "forgemind-security",
    # FM-213: structured logging
    "structlog>=24.0.0",
    # FM-216/224: Redis caching + SSE pub/sub
    "redis>=5.0.0",
    # FM-219: email templates
    "jinja2>=3.1.0",
    # FM-218: object storage
    "minio>=7.2.0",
    # FM-225: sandbox HTTP tool
    "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
]
otel = [
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "evals*"]
