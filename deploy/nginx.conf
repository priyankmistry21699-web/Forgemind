# ============================================================
# ForgeMind — Nginx Reverse Proxy Configuration
# ============================================================
# Place TLS certificates in deploy/certs/ as:
#   fullchain.pem  (certificate + chain)
#   privkey.pem    (private key)
#
# For local/staging without TLS, comment out the HTTPS server
# block and uncomment the port 80 proxy_pass directives.
# ============================================================

upstream api {
    server api:8000;
}

upstream web {
    server web:3000;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────
server {
    listen 80;
    server_name _;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ──────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 50M;

    # ── API routes (/api/, /docs, /health, /metrics, /stream/) ─
    location /api/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://api;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://api;
    }

    location /health {
        proxy_pass http://api;
    }

    location /metrics {
        proxy_pass http://api;
        # Consider restricting access to internal IPs:
        # allow 10.0.0.0/8;
        # deny all;
    }

    # SSE streaming endpoints (long-lived connections)
    location /stream/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # ── Frontend (everything else) ──────────────────────────────
    location / {
        proxy_pass http://web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
